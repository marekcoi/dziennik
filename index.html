<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dziennik">
<meta name="theme-color" content="#1C1C1E">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Dziennik</title>
<style>
:root{--bg:#1C1C1E;--card:#2A2A2D;--card2:#36363A;--line:#3A3A3E;--tx:#F2F2F4;--tx2:#A1A1A8;--tx3:#6E6E75;--warn:#E5675A;
--hero:#352A20;--heroc:#23262E;--herob:#4A3A2A;--g1:#2E2A3A;--gb:#3E3850;--xp1:#C3A6FF;--xp2:#6C7BD9;
--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;height:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;width:100%;-webkit-appearance:none;appearance:none}
input[type=color]{padding:2px;height:40px;width:52px}
textarea{resize:none}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
/* lock */
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-top:var(--st)}
.lockin{display:flex;flex-direction:column;align-items:center;gap:16px}
.logo{width:76px;height:76px;border-radius:20px;background:linear-gradient(135deg,#3A3A40,#24242A);display:flex;align-items:center;justify-content:center}
.logo i{width:30px;height:30px;border:3px solid var(--tx2);border-radius:50%;border-right-color:transparent;transform:rotate(45deg)}
#lockTitle{color:var(--tx2);font-size:15px}
#lockMsg{min-height:16px;font-size:12px;color:var(--warn)}
.dots{display:flex;gap:14px;min-height:12px}.dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--tx2)}.dots i.f{background:var(--tx2)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:16px}
.pad button{height:72px;border-radius:50%;background:var(--card);font-size:26px}
.pad button:active{background:var(--card2)}
.pad .x{background:none;font-size:18px;color:var(--tx2)}
/* app */
#app{min-height:100%;display:flex;flex-direction:column}
#view{flex:1;padding:calc(var(--st) + 8px) 16px calc(var(--sb) + 90px)}
.tab{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;border-top:1px solid var(--line);background:rgba(28,28,30,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:8px 0 calc(var(--sb) + 8px);z-index:5}
.tab button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--tx3);min-width:58px}
.tab button.on{color:var(--tx)}
.ti{font-style:normal;font-size:21px;line-height:30px;width:44px;height:30px;border-radius:12px;display:flex;align-items:center;justify-content:center;filter:grayscale(1);opacity:.55;transition:all .2s}
.tab button.on .ti{filter:none;opacity:1;background:linear-gradient(160deg,var(--hero),var(--card2));box-shadow:0 0 0 1px var(--herob);transform:translateY(-2px)}
.hdr{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px}
.hdr b{font-size:26px;font-weight:700}
.hdr span{color:var(--tx2);font-size:13px;display:flex;align-items:center;gap:6px}
.sym{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 4px;border-radius:8px;font-size:13px;font-weight:700;flex:0 0 auto}
.sym.s{min-width:22px;height:22px;font-size:11px;border-radius:7px}
.sym.xs{min-width:18px;height:18px;font-size:10px;border-radius:5px;vertical-align:-4px}
.active{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;border:1px solid var(--line)}
.active.over{outline:1.5px solid var(--warn)}
.active .top{display:flex;align-items:center;gap:10px}
.active .t{font-size:28px;font-weight:600;flex:1}
.stop{background:var(--card2);border-radius:12px;padding:8px 14px;font-size:14px;font-weight:600}
.bar{height:5px;background:var(--card2);border-radius:3px;margin:12px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .5s}
.bar i.over{background:var(--warn)!important}
.meta{font-size:12px;color:var(--tx2);display:flex;justify-content:space-between;margin-top:4px}
.warn{color:var(--warn)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 18px}
.btn{background:var(--card);border:1px solid var(--line);border-radius:18px;height:84px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:12px;text-align:left}
.btn:active{transform:scale(.97)}
.btn.on{outline:1.5px solid var(--line)}
.btn small{font-size:12px;color:var(--tx2)}
.sec{font-size:12px;color:var(--tx3);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 8px}
.rowsec{display:flex;justify-content:space-between;align-items:center}
.add{color:var(--tx);background:var(--card);border-radius:10px;padding:6px 10px;font-size:13px;text-transform:none;letter-spacing:0}
.li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;width:100%;text-align:left}
.li>span:not(.sym){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.li em{font-style:normal;color:var(--tx2);font-size:13px}
.li small.sub{display:block;color:var(--tx3);font-size:12px}
.empty{color:var(--tx3);font-size:13px;padding:10px 0}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:12px;font-size:13px}
.seg button{flex:1;text-align:center;padding:7px 0;border-radius:8px;color:var(--tx2);font-weight:600}
.seg button.on{background:var(--card2);color:var(--tx)}
.nav{font-size:20px;padding:0 8px;color:var(--tx)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.cal .h{color:var(--tx3);padding-bottom:4px}
.cal .d{height:42px;border-radius:10px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.cal .d.today{outline:1.5px solid var(--tx2)}
.cal .d.sel{background:var(--card2);outline:1.5px solid var(--tx)}
.cal .d.fut{opacity:.4}
.pips{display:flex;gap:2px;height:5px}.pips i{width:5px;height:5px;border-radius:50%}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:linear-gradient(160deg,var(--g1),var(--card) 70%);border:1px solid var(--gb);border-radius:14px;padding:10px 12px}
.kpi small{font-size:11px;color:var(--tx2);display:block}
.kpi b{font-size:21px;font-weight:600}
.heat{border:1px solid var(--gb);display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;background:var(--card);border-radius:14px;padding:10px}
.heat i{border-radius:2px}
.bars{display:flex;align-items:flex-end;gap:5px;height:80px;background:var(--card);border-radius:14px 14px 0 0;padding:10px 12px 0}
.bars div{flex:1;border-radius:3px 3px 0 0;min-height:2px}
.bl{display:flex;justify-content:space-between;font-size:10px;color:var(--tx3);padding:4px 12px 8px;background:var(--card);border-radius:0 0 14px 14px}
.bl span{flex:1;text-align:center}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--tx3);font-weight:500;font-size:11px}
td.r,th.r{text-align:right}
.card{background:linear-gradient(160deg,var(--g1),var(--card) 65%);border:1px solid var(--gb);border-radius:16px;padding:12px;margin-bottom:10px}
.setrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.setrow label{font-size:11px;color:var(--tx2);display:flex;flex-direction:column;gap:4px}
.setrow .grow{flex:1}
.setbtn{display:block;width:100%;text-align:left;padding:13px 12px;background:linear-gradient(160deg,var(--g1),var(--card) 70%);border:1px solid var(--gb);border-radius:12px;margin-bottom:8px;font-size:15px}
.setbtn.danger{color:var(--warn)}
.info{font-size:12px;color:var(--tx3);line-height:1.5;margin-top:10px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:20}
#sheet .dim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:#242427;border-radius:22px 22px 0 0;padding:10px 16px calc(var(--sb) + 20px)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sub2{font-size:13px;color:var(--tx2);margin-top:6px}
.f{font-size:11px;color:var(--tx3);margin:14px 0 6px;display:block;letter-spacing:.4px}
.two{display:grid;grid-template-columns:1fr;gap:0}.two input,input[type=datetime-local]{min-width:0;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card);border-radius:10px;padding:8px 12px;font-size:13px}
.chip.on{background:var(--card2);outline:1.5px solid var(--tx2)}
.chip.ro{color:var(--tx2)}
.hint{font-size:12px;color:var(--tx3)}
.stars{display:flex;gap:8px}.stars button{width:38px;height:38px;border-radius:10px;background:var(--card)}
.stars button.on{background:#E0A458}
.err{color:var(--warn);font-size:13px;min-height:18px;margin-top:10px}
.save{display:block;width:100%;margin-top:6px;background:var(--tx);color:#111;border-radius:14px;padding:14px;font-weight:600;font-size:15px}
.row2{display:flex;justify-content:space-between;margin-top:12px}
.link{color:var(--tx2);font-size:14px;padding:6px 0}
.link.danger{color:var(--warn)}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.today{background:linear-gradient(160deg,#2C2440,var(--card) 60%);border:1px solid #45386A;border-radius:18px;padding:14px;margin-bottom:12px}
.msg{font-size:15px;line-height:1.45;margin-bottom:10px;white-space:pre-line;text-align:left;width:100%;display:block}
.blur{filter:blur(7px);-webkit-user-select:none;user-select:none}
.ck{display:flex;align-items:center;gap:10px;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
.ck span:nth-child(2){flex:1}.ck em{font-style:normal;color:var(--tx2)}
.ckm{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--tx3);display:flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 auto}
.ckm.ok{border-color:#7FAE8E;color:#7FAE8E}
.big-msg{font-size:19px;line-height:1.45;font-weight:600;padding:10px 0 14px;white-space:pre-line;text-align:left;width:100%;display:block}
.hintx{font-size:11px;color:var(--tx3);margin-bottom:8px}
.hero{display:block;width:100%;text-align:left;background:linear-gradient(160deg,var(--hero) 0%,var(--card) 55%);border:1px solid var(--herob);border-radius:22px;padding:16px;margin-bottom:12px}
.hero.cold{background:linear-gradient(160deg,var(--heroc) 0%,var(--card) 55%);border-color:var(--line)}
.hrow{display:flex;align-items:center;gap:14px}
.flame{position:relative;width:68px;height:68px;flex:0 0 auto}
.flame svg{width:68px;height:68px}
.flame .fo{fill:#4A4A50}.flame .fi{fill:#5A5A60}
.flame.on .fo{fill:url(#gfo)}.flame.on .fi{fill:url(#gfi)}
.flame.on svg{filter:drop-shadow(0 0 12px rgba(255,140,40,.55));animation:fl 2.6s ease-in-out infinite,glow 1.2s ease-in-out infinite alternate;transform-origin:50% 95%}
@keyframes glow{from{filter:drop-shadow(0 0 8px rgba(255,140,40,.45))}to{filter:drop-shadow(0 0 18px rgba(255,150,40,.85))}}
.flame.on.t1 .emb{fill:#D6F0FF}.flame.on.t2 .emb{fill:#F0D6FF}.flame:not(.on) svg{animation:breath 3s ease-in-out infinite}@keyframes breath{50%{opacity:.75}}
.flame.on.t1 svg{animation:fl 2.6s ease-in-out infinite,glow1 1.2s ease-in-out infinite alternate!important}@keyframes glow1{from{filter:drop-shadow(0 0 8px rgba(80,170,255,.5))}to{filter:drop-shadow(0 0 18px rgba(80,170,255,.9))}}
.flame.on.t2 svg{animation:fl 2.6s ease-in-out infinite,glow2 1.2s ease-in-out infinite alternate!important}@keyframes glow2{from{filter:drop-shadow(0 0 9px rgba(180,90,255,.5))}to{filter:drop-shadow(0 0 20px rgba(180,90,255,.95))}}
.flame.on.t3 svg{animation:fl 2.6s ease-in-out infinite,glow3 1.2s ease-in-out infinite alternate!important}@keyframes glow3{from{filter:drop-shadow(0 0 10px rgba(255,210,80,.55))}to{filter:drop-shadow(0 0 22px rgba(255,210,80,1))}}
.flame.on.t1 .fo{fill:url(#gbo)}.flame.on.t1 .fi{fill:url(#gbi)}.flame.on.t1 svg{filter:drop-shadow(0 0 14px rgba(80,170,255,.7))}
.flame.on.t2 .fo{fill:url(#gpo)}.flame.on.t2 .fi{fill:url(#gpi)}.flame.on.t2 svg{filter:drop-shadow(0 0 16px rgba(180,90,255,.75))}
.flame.on.t3 .fo{fill:url(#ggo)}.flame.on.t3 .fi{fill:url(#ggi)}.flame.on.t3 svg{filter:drop-shadow(0 0 18px rgba(255,210,80,.85))}
.spk{position:absolute;width:5px;height:5px;border-radius:50%;background:#FFE9A0;box-shadow:0 0 6px #FFD86B;animation:spk 1.6s ease-out infinite;opacity:0}
@keyframes spk{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),-34px) scale(.3);opacity:0}}
.ftier{font-size:11px;padding:2px 7px;border-radius:7px;background:#3A2E22;color:#FFB35C}
.ftier.t1{background:#1E2E44;color:#8CC8FF}.ftier.t2{background:#2E1E44;color:#C9A0FF}.ftier.t3{background:#3E3416;color:#FFD86B}
.bump{animation:bump .5s ease}@keyframes bump{50%{transform:scale(1.15);color:#fff}}
:root[data-theme="neon"]{--herob:#3A2A7A;--g1:#1A1F44;--gb:#2C3570;--bg:#0A0E1F;--card:#131A35;--card2:#1C2550;--line:#26305E;--hero:#1A1240;--heroc:#101A33;--xp1:#39F3FF;--xp2:#FF3CAC}
:root[data-theme="lateks"]{--herob:#5A0A16;--g1:#1A1012;--gb:#3A1A1E;--bg:#000;--card:#121212;--card2:#1F1F1F;--line:#2A2A2A;--hero:#3A0610;--heroc:#161616;--xp1:#FF5A5A;--xp2:#B3001B}
:root[data-theme="zloto"]{--herob:#6A4A16;--g1:#2A2112;--gb:#4A3A1C;--bg:#110D07;--card:#1F1910;--card2:#2C2416;--line:#3A2F1C;--hero:#4A3410;--heroc:#221B10;--xp1:#FFE08A;--xp2:#C98A1A}
:root[data-theme="fiolet"]{--herob:#5A2A8A;--g1:#2A1C44;--gb:#45306A;--bg:#120A1F;--card:#1E1430;--card2:#2A1D44;--line:#352656;--hero:#3E1A66;--heroc:#1C1430;--xp1:#E0A8FF;--xp2:#8A3FFC}
.lad{background:linear-gradient(160deg,#1F2A3A,var(--card) 60%);border:1px solid #2F4260;border-radius:18px;padding:12px;margin-bottom:10px}
.lad .st{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}.lad .st:first-of-type{border-top:0}
.lad .st .nm{flex:1}.lad .st em{font-style:normal;font-size:11px;color:var(--tx2)}
.lad .dot{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:var(--card2);color:var(--tx3);flex:0 0 auto}
.lad .ok .dot{background:#2F5A3C;color:#BFF0CC}.lad .cur .dot{background:linear-gradient(160deg,#FFB35C,#FF7A2F);color:#2a1a08}
.lad h5{font-size:13px;margin-bottom:6px;display:flex;justify-content:space-between}.lad h5 small{color:var(--tx2);font-weight:400}
.spark{width:100%;height:60px;display:block;margin-top:6px}
.fst{display:flex;gap:4px;margin:8px 0 2px}.fst i{flex:1;height:8px;border-radius:4px;background:var(--card2)}.fst i.ok{background:#E07A5F}.fst i.cur{background:linear-gradient(90deg,#E07A5F 0%,#E07A5F var(--p),#5A3A32 var(--p))}
.thm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.thm button{border-radius:14px;padding:10px;text-align:left;font-size:13px;border:1.5px solid transparent}
.thm button.on{border-color:var(--tx)}.thm button[disabled]{opacity:.45}
.thm .sw{display:flex;gap:4px;margin-bottom:6px}.thm .sw i{width:16px;height:16px;border-radius:5px}
.yr{border:1px solid var(--gb);display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:1.5px;background:var(--card);border-radius:14px;padding:10px;aspect-ratio:53/8.6}
.yr i{border-radius:1.5px;display:block}.yr i.e{box-shadow:inset 0 0 0 1.2px #fff}
.yl{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--tx2);margin-top:8px}.yl span{display:flex;align-items:center;gap:4px}.yl i{width:10px;height:10px;border-radius:2px;display:inline-block}
.ym{display:flex;justify-content:space-between;font-size:10px;color:var(--tx3);padding:0 10px;margin-bottom:3px}
.ev{background:linear-gradient(160deg,#1E3326,#2A2A2D 60%);border:1px solid #2F5A3C;border-radius:18px;padding:14px;margin-bottom:12px}
.ev .mh{display:flex;justify-content:space-between;align-items:baseline}.ev .mh b{font-size:15px}.ev .mh span{font-size:11px;color:#9FD7AE}
.adv{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.adv div{aspect-ratio:1;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--tx2)}
.adv .ok{background:#2F5A3C;color:#BFF0CC}.adv .td{background:linear-gradient(160deg,#C2185B,#7A1440);color:#fff;animation:pulse 1.6s infinite}.adv .fu{opacity:.35}.adv .ms{opacity:.55;text-decoration:line-through}
@keyframes fl{0%,100%{transform:scale(1) rotate(-1deg)}50%{transform:scale(1.05) rotate(1deg)}}
.flame b{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:21px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.hs{font-size:24px;font-weight:800;letter-spacing:-.3px}
.hsub{font-size:12px;color:var(--tx2);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.hsub .ice{color:#7CC4F5}
.week{display:flex;justify-content:space-between;margin:16px 0 14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;color:var(--tx3)}
.wd i{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;font-weight:800;background:#36363A;color:#fff}
.wd.done i{background:linear-gradient(160deg,#FFB35C,#FF7A2F);color:#3A1A04;box-shadow:0 0 10px rgba(255,130,40,.35)}
.wd.frz i{background:linear-gradient(160deg,#9AD6FF,#4C9BE0)}
.wd.miss i{opacity:.45}
.wd.tod i{background:none;border:2px dashed #FF9F43;animation:pulse 1.6s ease-in-out infinite}
.wd.tod span{color:var(--tx)}
.wd.fut i{opacity:.3}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.lvl{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--tx2);margin-bottom:6px;gap:8px}
.lvl b{color:var(--tx);font-size:13px}
.lvlc{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:7px;background:linear-gradient(160deg,#C3A6FF,#7A6BE0);color:#fff;font-weight:800;font-size:12px;margin-right:6px;padding:0 4px}
.xpbar{height:10px;border-radius:5px;background:#36363A;overflow:hidden}

const LBL={m_hand:'ręka',m_toy:'zabawka',m_hf:'bez rąk',m_cage:'przez K',k_full:'pełny',k_ruined:'zrujnowany',k_milk:'dojenie',d_sw:'opcja S',d_toy:'na przedmiot',d_plug:'zatkane',d_body:'na ciało',d_other:'inne',sw_hand:'z ręki',sw_lick:'zlizane',sw_later:'później',ev_jan:'Styczeń z P',ev_feb:'Luty z D',ev_mar:'Marzec rozciągania',ev_apr:'Kwiecień nocy',ev_may:'Maj kontroli',ev_jun:'Czerwiec bez rąk',ev_jul:'Lipiec krawędzi',ev_aug:'Sierpień ręki',ev_sep:'Wrzesień szczebla',ev_oct:'Locktober',edge:'Edge',fs1:'Etap 1',fs2:'Etap 2',fs3:'Etap 3',fs4:'Etap 4',fs5:'Etap 5',fs6:'Etap 6',nnn:'Listopad bez E',ao:'AO',ao_long:'Wynik ★',sw:'S',sw_long:'Opcja S',night:'Noc'};

function b64(buf){const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}

async function derive(pass,salt,iter){const base=await crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}

async function submitPin(){
  if(pin.length<4){renderLock('Minimum 4 cyfry');return;}
  if(mode==='setup1'){firstPin=pin;mode='setup2';pin='';renderLock();return;}
  if(mode==='setup2'){
    if(pin!==firstPin){mode='setup1';pin='';renderLock('PIN-y się różnią');return;}
    busy(true,'Tworzenie klucza…');
    const salt=crypto.getRandomValues(new Uint8Array(16));
    META={v:2,salt:b64(salt),iter:ITER,fails:0,wipe:10};
    KEY=await newDK();await wrapPin(pin);S=newState();migrate();pin='';firstPin='';
    await save();busy(false);enterApp();return;
  }
  busy(true,'Odszyfrowywanie…');
  try{
    const kek=await derive(pin,unb64(META.salt),META.iter);
    if(META.wPin){const raw=await unseal(kek,META.wPin);DKRAW=raw;KEY=await importDK(raw);S=await unseal(KEY,BOX);}
    else{S=await unseal(kek,BOX);KEY=await newDK();await wrapPin(pin);}
    migrate();META.fails=0;await save();
    pin='';busy(false);enterApp();
  }catch(e){
    S=null;KEY=null;META.fails=(META.fails||0)+1;pin='';
    if(META.wipe&&META.fails>=META.wipe){await idb.del('vault');META=null;BOX=null;mode='setup1';busy(false);renderLock('Dane usunięte po zbyt wielu próbach');return;}
    await persist();busy(false);renderLock(`Błędny PIN (${META.fails}${META.wipe?' / '+META.wipe:''})`);
  }
}

  <div class="sec">${alias('F')} — etapy</div><div class="card"><div class="setrow"><label class="grow">etap startowy<select data-set="f_start">${[1,2,3,4,5,6].map(n=>`<option value="${n}"${S.fist.start===n?' selected':''}>${esc(fsName(n))}</option>`).join('')}</select></label><label class="grow">przerwa po etapie 4+<select data-set="f_rest">${[24,36,48,72].map(n=>`<option value="${n}"${S.fist.rest===n?' selected':''}>${n} h</option>`).join('')}</select></label></div>
   <div class="info">Etap startowy = to, co już opanowałeś. Awans: 3 sesje na odblokowanym etapie z komfortem 4+, poza przerwą. Sesja w trakcie przerwy daje tylko 10 XP i nie liczy się do awansu; zachowana przerwa daje +20 XP.</div></div>

   <div class="info">${alias('E')} w planie: 50 XP i podwójna celebracja. Poza planem: 10 XP — nadal celebracja, ale mniej punktów. Losowanie: raz dziennie przyciskiem na ekranie Teraz.</div></div>

  h+=`<div class="info">Dane są tylko na tym urządzeniu, zaszyfrowane AES-256-GCM kluczem z PIN-u (PBKDF2, ${ITER.toLocaleString('pl-PL')} iteracji). Aplikacja nie ma dostępu do sieci. Wersja: v20.<br>Sesji: ${S.sessions.length} · zdarzeń: ${S.events.length} · przedmiotów: ${S.items.length}</div>`;
  $('#view').innerHTML=h;

/* ---------- sheet ---------- */
function openSheet(draw,onClick,onInput){
  const root=$('#sheet'),box=root.querySelector('.sheet');root.hidden=false;
  const redraw=()=>{box.innerHTML=draw();};redraw();box.scrollTop=0;
  box.onclick=ev=>{const b=ev.target.closest('[data-x]');if(b){ev.preventDefault();onClick(b.dataset.x,b.dataset.v,redraw,b);}};
  box.oninput=box.onchange=onInput||null;
  root.querySelector('.dim').onclick=closeSheet;
}
function closeSheet(){const r=$('#sheet');r.hidden=true;r.querySelector('.sheet').innerHTML='';}

function openEntry(k,id,opt={}){
  const isNew=!id,arr=k==='s'?S.sessions:S.events,o=isNew?opt.draft:arr.find(x=>x.id===id);if(!o)return;
  const w=JSON.parse(JSON.stringify(o));let delArm=false;
  const draw=()=>{
    let h='<div class="grab"></div>';
    if(k==='s'){
      h+=`<h3>${sym(w.cat,'s')} ${opt.finish?'zakończono':isNew?'nowa sesja':'sesja'}</h3>`;
      if(isNew)h+=`<span class="f">KATEGORIA</span><div class="chips">${SESS.filter(catOn).map(c=>`<button class="chip${w.cat===c?' on':''}" data-x="cat" data-v="${c}">${alias(c)}</button>`).join('')}</div>`;
      h+=`<div class="two"><label><span class="f">START</span><input type="datetime-local" data-in="start" value="${toInput(w.start)}"></label><label><span class="f">KONIEC</span><input type="datetime-local" data-in="end" value="${w.end?toInput(w.end):''}"></label></div>`;
      h+=`<p class="sub2 num" id="durl">${w.end?dur(wearMs(w)):'trwa'}${w.pauses&&w.pauses.length?` · przerwy: ${w.pauses.length} (${dur(pauseTotal(w))}, nie wliczane)`:''}</p>`;
      const its=S.items.filter(i=>i.cat===w.cat&&!i.planned);
      if(w.cat!=='F'&&w.cat!=='M')h+=`<span class="f">PRZEDMIOT</span><div class="chips">${its.map(i=>`<button class="chip${w.itemId===i.id?' on':''}" data-x="item" data-v="${i.id}">${esc(i.alias)}</button>`).join('')||'<span class="hint">Dodaj w zakładce Przedmioty</span>'}</div>`;
      if(w.cat==='F'){const F=fistState();
        h+=`<span class="f">ETAP</span><div class="chips">${[1,2,3,4,5,6].map(n=>`<button class="chip${w.stage===n?' on':''}" data-x="stage" data-v="${n}">${esc(fsName(n))}${n>F.un?' 🔒':''}</button>`).join('')}</div>
          <p class="hint" style="margin-top:6px">Odblokowany: ${esc(fsName(F.un))} · awans po 3 sesjach na tym etapie z komfortem 4+ (${F.cnt}/3)${F.inRest&&isNew?` · trwa przerwa do ${hm(F.restUntil)} — sesja nie liczy się do awansu`:''}</p>
          <span class="f">PRZYGOTOWANIE</span><div class="chips"><button class="chip${w.warm?' on':''}" data-x="warm">rozgrzewka (+15 XP)</button><button class="chip${w.glove?' on':''}" data-x="glove">rękawiczka (+5 XP)</button></div>`;}
      if(w.cat==='M')h+=`<span class="f">ZAKOŃCZENIE</span><div class="chips">${[['none','bez '+alias('E')+' (kontrola)'],['E',alias('E')+' · '+L('k_full')],['ruin',L('k_ruined')]].map(([v,l])=>`<button class="chip${(w.res||'none')===v?' on':''}" data-x="res" data-v="${v}">${esc(l)}</button>`).join('')}</div>`;
      if(w.cat!=='R'&&w.cat!=='M')h+=`<span class="f">KOMFORT</span><div class="chips">${[0,1,2,3,4,5].map(n=>`<button class="chip${w.comfort===n?' on':''}" data-x="comfort" data-v="${n}">${n}</button>`).join('')}</div>`;
      if(w.cat!=='P')h+=`<span class="f">${esc(L('edge')).toUpperCase()} (bez wytrysku)</span><div class="chips">${[0,1,2,3,4,5,6,8,10].map(n=>`<button class="chip${(w.edges||0)===n?' on':''}" data-x="edges" data-v="${n}">${n}</button>`).join('')}</div>`;
      if(w.cat==='D')h+=`<span class="f">${esc(L('ao_long')).toUpperCase()}</span><div class="chips">${[0,1,2,3,4,5].map(n=>`<button class="chip${(w.ao||0)===n?' on':''}" data-x="ao" data-v="${n}">${n}</button>`).join('')}</div>`;
      if(!isNew){const n=S.events.filter(e=>e.sessionId===w.id).length;h+=`<span class="f">ZDARZENIA ${alias('E')} W TRAKCIE</span><div class="chips"><span class="chip ro num">${n}</span><button class="chip" data-x="addev">+ dodaj</button></div>`;}
    }else{
      h+=`<h3>${sym('E','s')} ${isNew||opt.finish?'nowe zdarzenie':'zdarzenie'}</h3><label><span class="f">CZAS</span><input type="datetime-local" data-in="at" value="${toInput(w.at)}"></label>`;
      const ov=S.sessions.filter(s=>s.start<=w.at&&(s.end||Date.now())>=w.at);
      h+=`<span class="f">PODCZAS SESJI</span><div class="chips"><button class="chip${!w.sessionId?' on':''}" data-x="sess" data-v="">brak</button>${ov.map(s=>`<button class="chip${w.sessionId===s.id?' on':''}" data-x="sess" data-v="${s.id}">${alias(s.cat)} od ${hm(s.start)}</button>`).join('')}</div>`;
      const tags=[...new Set(S.events.map(e=>e.tag).filter(Boolean))];
      const ch=(x,v,l,on)=>`<button class="chip${on?' on':''}" data-x="${x}" data-v="${v}">${esc(l)}</button>`;
      h+=`<span class="f">RODZAJ</span><div class="chips">${[['full',L('k_full')],['ruined',L('k_ruined')+' +20'],['milk',L('k_milk')+' +30']].map(([v,l])=>ch('ekind',v,l,(w.kind||'full')===v)).join('')}</div>`;
      if(w.kind==='milk')h+=`<p class="hint" style="margin-top:6px">${esc(L('k_milk'))} nie zeruje licznika bez ${alias('E')} ani eventów.</p>`;
      h+=`<span class="f">METODA</span><div class="chips">${[['hand',L('m_hand')],['toy',L('m_toy')],['hf',L('m_hf')+' +100'],['cage',L('m_cage')]].map(([v,l])=>ch('emeth',v,l,w.method===v)).join('')}</div>`;
      h+=`<span class="f">INTENSYWNOŚĆ</span><div class="chips">${[1,2,3,4,5].map(n=>ch('einten',n,String(n),w.inten===n)).join('')}</div>`;
      h+=`<span class="f">ILOŚĆ</span><div class="two" style="display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center"><div class="chips">${[['low','mało'],['mid','średnio'],['high','dużo']].map(([v,l])=>ch('eamt',v,l,w.amt===v)).join('')}</div><input type="number" inputmode="decimal" step="0.1" data-in="ml" value="${w.ml||''}" placeholder="ml"></div>`;
      h+=`<span class="f">CO DALEJ</span><div class="chips">${[['sw',L('d_sw')+' +20'],['toy',L('d_toy')+' +10'],['plug',L('d_plug')+' +30'],['body',L('d_body')],['other',L('d_other')]].map(([v,l])=>ch('edest',v,l,w.dest===v)).join('')}</div>`;
      if(w.dest==='sw')h+=`<div class="chips" style="margin-top:6px">${[['hand',L('sw_hand')],['lick',L('sw_lick')],['later',L('sw_later')+' +10']].map(([v,l])=>ch('eswm',v,l,(w.swm||'hand')===v)).join('')}</div>`;
      if(w.dest==='toy'||w.dest==='plug'){const its2=S.items.filter(i=>!i.planned&&(w.dest==='plug'?i.cat==='P':(i.cat==='P'||i.cat==='D')));
        h+=`<div class="chips" style="margin-top:6px">${its2.map(i=>ch('eitem',i.id,i.alias,w.destItem===i.id)).join('')||'<span class="hint">Dodaj przedmioty w zakładce Przedmioty</span>'}</div>`;
        if(w.dest==='toy')h+=`<div class="chips" style="margin-top:6px">${ch('elick',1,L('sw_lick')+' (+'+XPV.SW+')',w.lick)}</div>`;
        if(w.dest==='plug'&&!w.plugSid)h+=`<p class="hint" style="margin-top:6px">Po zapisaniu ruszy sesja ${alias('P')} oznaczona 💧 (albo oznaczy się trwająca).</p>`;}
      if(w.plan!=null)h+=`<span class="f">PLAN</span><div class="chips"><span class="chip ro">${w.plan?'✓ w planie':'poza planem'}</span></div>`;
      h+=`<span class="f">KONTEKST</span><input type="text" data-in="tag" list="tagl" maxlength="30" value="${esc(w.tag)}" placeholder="własny znacznik (opcjonalnie)"><datalist id="tagl">${tags.map(t=>`<option value="${esc(t)}">`).join('')}</datalist>`;
    }
    h+=`<span class="f">OCENA</span><div class="stars">${[1,2,3,4,5].map(n=>`<button class="${(w.rating||0)>=n?'on':''}" data-x="rate" data-v="${n}"></button>`).join('')}</div>`;
    h+=`<span class="f">NOTATKA</span><textarea data-in="note" rows="3" maxlength="2000" placeholder="Opcjonalnie…">${esc(w.note)}</textarea>`;
    h+=`<div class="err" id="err"></div><button class="save" data-x="save">Zapisz</button><div class="row2">${isNew?'<span></span>':`<button class="link danger" data-x="del">${delArm?'Na pewno usunąć?':'Usuń'}</button>`}<button class="link" data-x="close">${opt.finish?'Pomiń szczegóły':'Anuluj'}</button></div>`;
    return h;
  };
  openSheet(draw,(x,v,redraw)=>{
    if(x==='cat'){w.cat=v;w.itemId=null;redraw();}
    else if(x==='item'){w.itemId=w.itemId===v?null:v;redraw();}
    else if(x==='ao'){w.ao=+v;redraw();}
    else if(x==='res'){w.res=v;redraw();}
    else if(x==='emeth'){w.method=w.method===v?null:v;redraw();}else if(x==='ekind'){w.kind=v;redraw();}else if(x==='einten'){w.inten=w.inten===+v?null:+v;redraw();}
    else if(x==='eamt'){w.amt=w.amt===v?null:v;redraw();}else if(x==='edest'){w.dest=w.dest===v?null:v;redraw();}else if(x==='eswm'){w.swm=v;redraw();}
    else if(x==='eitem'){w.destItem=w.destItem===v?null:v;redraw();}else if(x==='elick'){w.lick=!w.lick;redraw();}
    else if(x==='stage'){w.stage=+v;redraw();}else if(x==='warm'){w.warm=!w.warm;redraw();}else if(x==='glove'){w.glove=!w.glove;redraw();}
    else if(x==='comfort'){w.comfort=w.comfort===+v?null:+v;redraw();}else if(x==='edges'){w.edges=+v;redraw();}
    else if(x==='rate'){w.rating=w.rating===+v?null:+v;redraw();}
    else if(x==='sess'){w.sessionId=v||null;redraw();}
    else if(x==='addev'){S.events.push({id:uid(),at:w.end||Date.now(),rating:null,sessionId:w.id,tag:'',note:''});save();redraw();toast('Dodano zdarzenie');}
    else if(x==='close'){closeSheet();if(opt.finish&&k==='s')afterFinish(o);else if(opt.finish)celebrate();else render();}
    else if(x==='del'){
      if(!delArm){delArm=true;redraw();return;}
      const i=arr.findIndex(z=>z.id===w.id);if(i>=0)arr.splice(i,1);
      if(k==='s')S.events.forEach(e=>{if(e.sessionId===w.id)e.sessionId=null;});
      save();closeSheet();render();toast('Usunięto');
    }
    else if(x==='save'){
      const err=t=>{$('#err').textContent=t;};
      if(k==='s'){
        if(!w.start)return err('Podaj start');
        if(w.cat==='F'&&!w.stage)return err('Wybierz etap');
        if(w.end&&w.end<w.start)return err('Koniec jest przed startem');
        if(!w.end&&S.sessions.some(s=>s.id!==w.id&&s.cat===w.cat&&!s.end))return err('Ta kategoria już trwa — podaj koniec');
      }else if(!w.at)return err('Podaj czas');
      if(k==='e'&&w.sessionId){const s=S.sessions.find(z=>z.id===w.sessionId);if(!s||s.start>w.at||(s.end&&s.end<w.at))w.sessionId=null;}
      if(k==='e'){w.sw=w.dest==='sw'||(w.dest==='toy'&&!!w.lick);if(!w.kind)w.kind='full';
        if(w.dest==='plug'&&!w.plugSid){let ps=S.sessions.find(z=>z.cat==='P'&&!z.end);if(ps){ps.cum=true;ps.cumAt=w.at;if(!ps.itemId&&w.destItem)ps.itemId=w.destItem;}else{ps={id:uid(),cat:'P',start:w.at,end:null,itemId:w.destItem||null,rating:null,note:'',cum:true,cumAt:w.at};S.sessions.push(ps);}w.plugSid=ps.id;}}
      if(isNew)arr.push(w);else Object.assign(o,w);
      if(k==='s'){const ss=isNew?w:o;if(ss.cat==='M'&&ss.end&&(ss.res==='E'||ss.res==='ruin')&&!S.events.some(z=>z.sessionId===ss.id)){save();closeSheet();return startEjac({at:ss.end,sessionId:ss.id,kind:ss.res==='ruin'?'ruined':'full',method:'hand'});}}
      save();closeSheet();if(opt.finish&&k==='s')afterFinish(o);else if(opt.finish)celebrate();else{render();toast('Zapisano');}
    }
  },ev=>{
    const n=ev.target.dataset.in;if(!n)return;
    if(n==='start'||n==='end'||n==='at'){w[n]=fromInput(ev.target.value);const dl=$('#durl');if(dl&&k==='s')dl.textContent=w.end&&w.start?dur(w.end-w.start):'trwa';}
    else if(n==='ml'){const v=parseFloat(String(ev.target.value).replace(',','.'));w.ml=v>0?Math.round(v*10)/10:null;}
    else w[n]=ev.target.value;
  });
}

}

$('#impm').addEventListener('change',async ev=>{

    const mch={};if(pk.mch&&typeof pk.mch==='object')for(const [k,v] of Object.entries(pk.mch))if(/^[a-z_0-9]{1,20}$/.test(k)&&typeof v==='string')mch[k]=v.slice(0,40);
    S.msg={pools,levels,badges,icons:ni?icons:undefined,labels,mch};headMsg.key='';await save();render();toast(`Wczytano ${n} tekstów. Usuń teraz plik z telefonu.`);
  }catch(e){toast('To nie jest pakiet komunikatów');}
});

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  if(!S&&!t.closest('#lock'))return;
  const fn=ACT[t.dataset.act];if(fn){e.preventDefault();fn(t.dataset,t);}
});
$('#view').addEventListener('change',ev=>{
  const el=ev.target,s=el.dataset.set;if(!s||!S)return;const c=el.dataset.cat;
  if(s==='alias')S.cats[c].alias=el.value.trim().slice(0,12)||c;
  else if(s==='emoji')S.cats[c].emoji=oneEmoji(el.value);
  else if(s==='kon')S.cats.K.on=el.value==='1';
  else if(s==='color')S.cats[c].color=/^#[0-9a-f]{6}$/i.test(el.value)?el.value:DEF[c].color;
  else if(s==='limit'){const v=parseInt(el.value,10);S.cats[c].limit=v>0?v:null;}
  else if(s==='autolock')S.settings.autolock=+el.value;
  else if(s==='wipe')META.wipe=+el.value;
  else if(s==='g_plug')S.goals.plugDaily=el.value==='1';
  else if(s==='g_d'||s==='g_big'||s==='g_r'){const v=Math.max(0,Math.min(14,parseInt(el.value,10)||0));S.goals[{g_d:'dPerWeek',g_big:'bigPerWeek',g_r:'rPerWeek'}[s]]=v;}
  else if(s==='msgs')S.settings.msgs=el.value==='1';
  else if(s==='discreet')S.settings.discreet=el.value==='1';
  else if(s==='gfx')S.settings.gfx=el.value==='1';
  else if(s==='fx')S.settings.fx=el.value==='1';
  else if(s==='pl_mode')S.plan.mode=el.value;
  else if(s==='f_start')S.fist.start=+el.value;
  else if(s==='f_rest')S.fist.rest=+el.value;
  else if(s==='pl_n')S.plan.n=Math.max(1,Math.min(90,parseInt(el.value,10)||7));
  else if(s==='pl_p')S.plan.p=+el.value;
  headMsg.key='';
  save();render();
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){document.body.classList.add('veil');hiddenAt=Date.now();if(S&&S.settings.autolock===0)lock();}
  else{if(S&&Date.now()-hiddenAt>S.settings.autolock*1000)lock();document.body.classList.remove('veil');if(S)render();}
});

(async function init(){
  try{
    const v=await idb.get('vault');
    if(v&&v.ct){META={v:v.v||1,salt:v.salt,iter:v.iter,fails:v.fails||0,wipe:v.wipe==null?10:v.wipe,wPin:v.wPin,wFace:v.wFace};BOX={iv:v.iv,ct:v.ct};mode='unlock';}
    else mode='setup1';
  }catch(e){mode='setup1';}
  showLock();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
