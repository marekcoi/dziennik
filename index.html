<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dziennik">
<meta name="theme-color" content="#1C1C1E">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Dziennik</title>
<style>
:root{--bg:#1C1C1E;--card:#2A2A2D;--card2:#36363A;--line:#3A3A3E;--tx:#F2F2F4;--tx2:#A1A1A8;--tx3:#6E6E75;--warn:#E5675A;
--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;height:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;width:100%;-webkit-appearance:none;appearance:none}
input[type=color]{padding:2px;height:40px;width:52px}
textarea{resize:none}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
/* lock */
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-top:var(--st)}
.lockin{display:flex;flex-direction:column;align-items:center;gap:16px}
.logo{width:76px;height:76px;border-radius:20px;background:linear-gradient(135deg,#3A3A40,#24242A);display:flex;align-items:center;justify-content:center}
.logo i{width:30px;height:30px;border:3px solid var(--tx2);border-radius:50%;border-right-color:transparent;transform:rotate(45deg)}
#lockTitle{color:var(--tx2);font-size:15px}
#lockMsg{min-height:16px;font-size:12px;color:var(--warn)}
.dots{display:flex;gap:14px;min-height:12px}.dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--tx2)}.dots i.f{background:var(--tx2)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:16px}
.pad button{height:72px;border-radius:50%;background:var(--card);font-size:26px}
.pad button:active{background:var(--card2)}
.pad .x{background:none;font-size:18px;color:var(--tx2)}
/* app */
#app{min-height:100%;display:flex;flex-direction:column}
#view{flex:1;padding:calc(var(--st) + 8px) 16px calc(var(--sb) + 90px)}
.tab{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;border-top:1px solid var(--line);background:rgba(28,28,30,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:8px 0 calc(var(--sb) + 8px);z-index:5}
.tab button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--tx3);min-width:58px}
.tab button.on{color:var(--tx)}
.ti{width:20px;height:20px;border-radius:6px;border:1.6px solid currentColor}
.tab button.on .ti{background:currentColor}
.hdr{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px}
.hdr b{font-size:26px;font-weight:700}
.hdr span{color:var(--tx2);font-size:13px;display:flex;align-items:center;gap:6px}
.sym{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 4px;border-radius:8px;font-size:13px;font-weight:700;flex:0 0 auto}
.sym.s{min-width:22px;height:22px;font-size:11px;border-radius:7px}
.sym.xs{min-width:18px;height:18px;font-size:10px;border-radius:5px;vertical-align:-4px}
.active{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px}
.active.over{outline:1.5px solid var(--warn)}
.active .top{display:flex;align-items:center;gap:10px}
.active .t{font-size:28px;font-weight:600;flex:1}
.stop{background:var(--card2);border-radius:12px;padding:8px 14px;font-size:14px;font-weight:600}
.bar{height:5px;background:var(--card2);border-radius:3px;margin:12px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .5s}
.bar i.over{background:var(--warn)!important}
.meta{font-size:12px;color:var(--tx2);display:flex;justify-content:space-between;margin-top:4px}
.warn{color:var(--warn)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 18px}
.btn{background:var(--card);border-radius:18px;height:84px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:12px;text-align:left}
.btn:active{background:var(--card2)}
.btn.on{outline:1.5px solid var(--line)}
.btn small{font-size:12px;color:var(--tx2)}
.sec{font-size:12px;color:var(--tx3);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 8px}
.rowsec{display:flex;justify-content:space-between;align-items:center}
.add{color:var(--tx);background:var(--card);border-radius:10px;padding:6px 10px;font-size:13px;text-transform:none;letter-spacing:0}
.li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;width:100%;text-align:left}
.li>span:not(.sym){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.li em{font-style:normal;color:var(--tx2);font-size:13px}
.li small.sub{display:block;color:var(--tx3);font-size:12px}
.empty{color:var(--tx3);font-size:13px;padding:10px 0}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;margin-bottom:12px;font-size:13px}
.seg button{flex:1;text-align:center;padding:7px 0;border-radius:8px;color:var(--tx2);font-weight:600}
.seg button.on{background:var(--card2);color:var(--tx)}
.nav{font-size:20px;padding:0 8px;color:var(--tx)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.cal .h{color:var(--tx3);padding-bottom:4px}
.cal .d{height:42px;border-radius:10px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.cal .d.today{outline:1.5px solid var(--tx2)}
.cal .d.sel{background:var(--card2);outline:1.5px solid var(--tx)}
.cal .d.fut{opacity:.4}
.pips{display:flex;gap:2px;height:5px}.pips i{width:5px;height:5px;border-radius:50%}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--card);border-radius:14px;padding:10px 12px}
.kpi small{font-size:11px;color:var(--tx2);display:block}
.kpi b{font-size:21px;font-weight:600}
.heat{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;background:var(--card);border-radius:14px;padding:10px}
.heat i{border-radius:2px}
.bars{display:flex;align-items:flex-end;gap:5px;height:80px;background:var(--card);border-radius:14px 14px 0 0;padding:10px 12px 0}
.bars div{flex:1;border-radius:3px 3px 0 0;min-height:2px}
.bl{display:flex;justify-content:space-between;font-size:10px;color:var(--tx3);padding:4px 12px 8px;background:var(--card);border-radius:0 0 14px 14px}
.bl span{flex:1;text-align:center}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--tx3);font-weight:500;font-size:11px}
td.r,th.r{text-align:right}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
.setrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.setrow label{font-size:11px;color:var(--tx2);display:flex;flex-direction:column;gap:4px}
.setrow .grow{flex:1}
.setbtn{display:block;width:100%;text-align:left;padding:13px 12px;background:var(--card);border-radius:12px;margin-bottom:8px;font-size:15px}
.setbtn.danger{color:var(--warn)}
.info{font-size:12px;color:var(--tx3);line-height:1.5;margin-top:10px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:20}
#sheet .dim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:#242427;border-radius:22px 22px 0 0;padding:10px 16px calc(var(--sb) + 20px)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sub2{font-size:13px;color:var(--tx2);margin-top:6px}
.f{font-size:11px;color:var(--tx3);margin:14px 0 6px;display:block;letter-spacing:.4px}
.two{display:grid;grid-template-columns:1fr;gap:0}.two input,input[type=datetime-local]{min-width:0;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card);border-radius:10px;padding:8px 12px;font-size:13px}
.chip.on{background:var(--card2);outline:1.5px solid var(--tx2)}
.chip.ro{color:var(--tx2)}
.hint{font-size:12px;color:var(--tx3)}
.stars{display:flex;gap:8px}.stars button{width:38px;height:38px;border-radius:10px;background:var(--card)}
.stars button.on{background:#E0A458}
.err{color:var(--warn);font-size:13px;min-height:18px;margin-top:10px}
.save{display:block;width:100%;margin-top:6px;background:var(--tx);color:#111;border-radius:14px;padding:14px;font-weight:600;font-size:15px}
.row2{display:flex;justify-content:space-between;margin-top:12px}
.link{color:var(--tx2);font-size:14px;padding:6px 0}
.link.danger{color:var(--warn)}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.today{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px}
.msg{font-size:15px;line-height:1.45;margin-bottom:10px;white-space:pre-line;text-align:left;width:100%;display:block}
.blur{filter:blur(7px);-webkit-user-select:none;user-select:none}
.ck{display:flex;align-items:center;gap:10px;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
.ck span:nth-child(2){flex:1}.ck em{font-style:normal;color:var(--tx2)}
.ckm{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--tx3);display:flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 auto}
.ckm.ok{border-color:#7FAE8E;color:#7FAE8E}
.big-msg{font-size:19px;line-height:1.45;font-weight:600;padding:10px 0 14px;white-space:pre-line;text-align:left;width:100%;display:block}
.hintx{font-size:11px;color:var(--tx3);margin-bottom:8px}
.hero{display:block;width:100%;text-align:left;background:linear-gradient(160deg,#352A20 0%,#2A2A2D 55%);border-radius:22px;padding:16px;margin-bottom:12px}
.hero.cold{background:linear-gradient(160deg,#23262E 0%,#2A2A2D 55%)}
.hrow{display:flex;align-items:center;gap:14px}
.flame{position:relative;width:68px;height:68px;flex:0 0 auto}
.flame svg{width:68px;height:68px}
.flame .fo{fill:#4A4A50}.flame .fi{fill:#5A5A60}
.flame.on .fo{fill:url(#gfo)}.flame.on .fi{fill:url(#gfi)}
.flame.on svg{filter:drop-shadow(0 0 12px rgba(255,140,40,.55));animation:fl 1.8s ease-in-out infinite;transform-origin:50% 90%}
@keyframes fl{0%,100%{transform:scale(1) rotate(-1.5deg)}50%{transform:scale(1.07) rotate(1.5deg)}}
.flame b{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:21px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.hs{font-size:24px;font-weight:800;letter-spacing:-.3px}
.hsub{font-size:12px;color:var(--tx2);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.hsub .ice{color:#7CC4F5}
.week{display:flex;justify-content:space-between;margin:16px 0 14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;color:var(--tx3)}
.wd i{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;font-weight:800;background:#36363A;color:#fff}
.wd.done i{background:linear-gradient(160deg,#FFB35C,#FF7A2F);color:#3A1A04;box-shadow:0 0 10px rgba(255,130,40,.35)}
.wd.frz i{background:linear-gradient(160deg,#9AD6FF,#4C9BE0)}
.wd.miss i{opacity:.45}
.wd.tod i{background:none;border:2px dashed #FF9F43;animation:pulse 1.6s ease-in-out infinite}
.wd.tod span{color:var(--tx)}
.wd.fut i{opacity:.3}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.lvl{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--tx2);margin-bottom:6px;gap:8px}
.lvl b{color:var(--tx);font-size:13px}
.lvlc{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:7px;background:linear-gradient(160deg,#C3A6FF,#7A6BE0);color:#fff;font-weight:800;font-size:12px;margin-right:6px;padding:0 4px}
.xpbar{height:10px;border-radius:5px;background:#36363A;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#C3A6FF,#6C7BD9);border-radius:5px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.celeb{font-size:60px;line-height:1.1;text-align:center;margin:4px 0 2px;font-weight:800;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.celeb.num{font-size:52px}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.csub{text-align:center;font-size:13px;color:var(--tx2);margin-bottom:6px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bdg{background:var(--card);border-radius:14px;padding:10px 6px;text-align:center;opacity:.35;filter:grayscale(1)}
.bdg.on{opacity:1;filter:none;background:linear-gradient(160deg,#3A3340,#2A2A2D)}
.bdg i{font-style:normal;font-size:28px;display:block}
.bdg b{font-size:11px;display:block;margin-top:4px;line-height:1.25}
.bdg small{font-size:10px;color:var(--tx3);display:block;margin-top:2px}
.xpt{font-size:12px;color:var(--tx2);line-height:1.6}
#cf{position:fixed;inset:0;pointer-events:none;z-index:60}
.chl{border-top:1px solid var(--line);padding:9px 0 4px}
.chl .t{display:flex;align-items:center;gap:8px;font-size:13px}
.chl .t span{flex:1}.chl .t em{font-style:normal;font-size:11px;font-weight:700;color:#FFB35C;background:#3A2E22;border-radius:8px;padding:2px 7px}
.chl.ok .t em{color:#7FAE8E;background:#24332A}
.pbar{height:6px;border-radius:3px;background:#36363A;margin:6px 0 2px;overflow:hidden}.pbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#FFB35C,#FF7A2F)}
.chl.ok .pbar i{background:#7FAE8E}
.chl small{font-size:11px;color:var(--tx3)}
.sech{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.6px;margin:12px 0 2px;display:flex;justify-content:space-between}
.dice{background:linear-gradient(160deg,#FFB35C,#FF7A2F);color:#2a1a08;border-radius:10px;padding:5px 10px;font-weight:700;font-size:12px}
.tgt{display:flex;gap:6px;align-items:center;margin-top:8px}
.tgt button{background:var(--card2);border-radius:9px;padding:5px 9px;font-size:12px;color:var(--tx2)}
.tbar i{background:linear-gradient(90deg,#7FAE8E,#5FD08E)!important}
.wr{background:linear-gradient(150deg,#3B2B5E,#7A3E6E 55%,#C2553F);border-radius:20px;padding:18px;margin-bottom:12px}
.wr h4{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:#FFD9C2;font-weight:600}
.wr .bigx{font-size:44px;font-weight:800;line-height:1.1;margin:4px 0}
.wr .cmp{font-size:13px;color:#FFE7D6}
.wtiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wt{background:var(--card);border-radius:14px;padding:10px 12px}.wt small{display:block;font-size:11px;color:var(--tx2)}.wt b{font-size:20px;font-weight:700}
.wkcmp{background:var(--card);border-radius:14px;padding:12px;margin-top:10px;font-size:13px}
.wkcmp .row{display:flex;justify-content:space-between;margin:6px 0 4px}
.sym.gi{padding:0}.sym.gi svg{width:74%;height:74%}
.btn .sym.gi{width:46px;height:46px;border-radius:13px}
.active .sym.gi{width:34px;height:34px;border-radius:10px}
.bdg .bi{display:block;width:64px;height:64px;margin:0 auto}.bdg .bi svg{width:100%;height:100%}
.cimg{display:flex;justify-content:center;margin:6px 0 4px;animation:pop .55s cubic-bezier(.2,1.6,.4,1)}.cimg svg{width:132px;height:132px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
/* misc */
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 80px);transform:translateX(-50%);background:var(--card2);padding:10px 16px;border-radius:12px;font-size:13px;z-index:40;opacity:0;max-width:90%;text-align:center;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--tx2)}
body.veil::after{content:'';position:fixed;inset:0;background:var(--bg);z-index:100}
</style>
</head>
<body>

<div id="lock" hidden>
  <div class="lockin">
    <div class="logo"><i></i></div>
    <div id="lockTitle">Dziennik</div>
    <div class="dots" id="dots"></div>
    <div id="lockMsg"></div>
    <div class="pad">
      <button data-act="pin" data-v="1">1</button><button data-act="pin" data-v="2">2</button><button data-act="pin" data-v="3">3</button>
      <button data-act="pin" data-v="4">4</button><button data-act="pin" data-v="5">5</button><button data-act="pin" data-v="6">6</button>
      <button data-act="pin" data-v="7">7</button><button data-act="pin" data-v="8">8</button><button data-act="pin" data-v="9">9</button>
      <button class="x" data-act="pin" data-v="del">⌫</button><button data-act="pin" data-v="0">0</button><button class="x" data-act="pin" data-v="ok">OK</button>
    </div>
  </div>
</div>

<div id="app" hidden>
  <main id="view"></main>
  <nav class="tab">
    <button data-act="tab" data-tab="now"><i class="ti"></i>Teraz</button>
    <button data-act="tab" data-tab="hist"><i class="ti"></i>Historia</button>
    <button data-act="tab" data-tab="stat"><i class="ti"></i>Statystyki</button>
    <button data-act="tab" data-tab="items"><i class="ti"></i>Przedmioty</button>
    <button data-act="tab" data-tab="set"><i class="ti"></i>Ustawienia</button>
  </nav>
</div>

<div id="sheet" hidden><div class="dim"></div><div class="sheet"></div></div>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="gfo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC15E"/><stop offset="1" stop-color="#FF5E2B"/></linearGradient>
<linearGradient id="gfi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3B0"/><stop offset="1" stop-color="#FFB547"/></linearGradient></defs></svg>
<div id="toast"></div>
<div id="busy" hidden>Szyfrowanie…</div>
<input type="file" id="impf" accept=".json,application/json" hidden>
<input type="file" id="impm" accept=".json,application/json" hidden>

<script>
'use strict';
const CATS=['R','P','D','E'], SESS=['R','P','D'];
const DEF={R:{alias:'R',color:'#E0A458',limit:null},P:{alias:'P',color:'#6C7BD9',limit:null},D:{alias:'D',color:'#7FAE8E',limit:null},E:{alias:'E',color:'#C47A8A',limit:null}};
const ITER=600000;
const te=new TextEncoder(), td=new TextDecoder();
let S=null, KEY=null, META=null, BOX=null, tab='now', hiddenAt=0, tick=null, saving=Promise.resolve();
let pin='', mode='unlock', firstPin='', busyOn=false;
const hist={y:0,m:0,day:null,filter:null};
const stat={cat:'E',range:30};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const pad2=n=>String(n).padStart(2,'0');

const idb=(()=>{let p;const db=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('dz',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
  const tx=(m,fn)=>db().then(d=>new Promise((res,rej)=>{const t=d.transaction('kv',m);const r=fn(t.objectStore('kv'));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error);}));
  return{get:k=>tx('readonly',s=>s.get(k)),set:(k,v)=>tx('readwrite',s=>s.put(v,k)),del:k=>tx('readwrite',s=>s.delete(k))};})();
function b64(buf){const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
function unb64(s){const bin=atob(s),b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b;}
async function derive(pass,salt,iter){const base=await crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function seal(key,str){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(str));return{iv:b64(iv),ct:b64(ct)};}
async function unseal(key,box){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(box.iv)},key,unb64(box.ct));return JSON.parse(td.decode(pt));}
const persist=()=>idb.set('vault',{salt:META.salt,iter:META.iter,fails:META.fails||0,wipe:META.wipe,iv:BOX&&BOX.iv,ct:BOX&&BOX.ct});
function save(){if(!S||!KEY)return saving;const snap=JSON.stringify(S),key=KEY;saving=saving.then(async()=>{BOX=await seal(key,snap);await persist();}).catch(()=>toast('Błąd zapisu'));return saving;}
function newState(){return{v:1,created:Date.now(),cats:JSON.parse(JSON.stringify(DEF)),items:[],sessions:[],events:[],settings:{autolock:60}};}
function migrate(){
  S.cats=S.cats||{};
  for(const c of CATS){const k=S.cats[c]=Object.assign({},DEF[c],S.cats[c]||{});if(!/^#[0-9a-fA-F]{6}$/.test(k.color))k.color=DEF[c].color;k.alias=String(k.alias||c).slice(0,12);k.limit=(+k.limit>0)?Math.round(+k.limit):null;}
  S.items=(Array.isArray(S.items)?S.items:[]).filter(i=>i&&SESS.includes(i.cat));
  S.sessions=(Array.isArray(S.sessions)?S.sessions:[]).filter(s=>s&&SESS.includes(s.cat)&&s.start);
  S.events=(Array.isArray(S.events)?S.events:[]).filter(e=>e&&e.at);
  S.settings=Object.assign({autolock:60,discreet:true,msgs:true},S.settings||{});
  S.goals=Object.assign({plugDaily:true,dPerWeek:1,bigPerWeek:1,rPerWeek:3},S.goals||{});
  S.seen=Object.assign({week:'',ms:''},S.seen||{});
  S.plan=Object.assign({mode:'off',n:7,p:20},S.plan||{});S.draws=S.draws||{};
  if(!S.created){const t=[...S.sessions.map(x=>x.start),...S.events.map(x=>x.at)];S.created=t.length?Math.min(...t):Date.now();}
  if(S.msg&&!(S.msg.pools&&typeof S.msg.pools==='object'))S.msg=null;

function renderLock(msg){
  $('#lockTitle').textContent=mode==='setup1'?'Ustaw PIN (4–8 cyfr, zalecane 6+)':mode==='setup2'?'Powtórz PIN':'Dziennik';
  $('#lockMsg').textContent=msg||'';

}
function showLock(msg){S=null;KEY=null;clearInterval(tick);closeSheet();$('#app').hidden=true;$('#lock').hidden=false;pin='';renderLock(msg);}
function lock(){if(!S)return;mode=META?'unlock':'setup1';showLock();}
function enterApp(){$('#lock').hidden=true;$('#app').hidden=false;tab='now';render();clearInterval(tick);tick=setInterval(updateLive,1000);checks();}
async function submitPin(){
  if(pin.length<4){renderLock('Minimum 4 cyfry');return;}
  if(mode==='setup1'){firstPin=pin;mode='setup2';pin='';renderLock();return;}
  if(mode==='setup2'){
    if(pin!==firstPin){mode='setup1';pin='';renderLock('PIN-y się różnią');return;}
    busy(true,'Tworzenie klucza…');
    const salt=crypto.getRandomValues(new Uint8Array(16));
    META={salt:b64(salt),iter:ITER,fails:0,wipe:10};
    KEY=await derive(pin,salt,ITER);S=newState();migrate();pin='';firstPin='';
    await save();busy(false);enterApp();return;
  }
  busy(true,'Odszyfrowywanie…');
  try{
    const key=await derive(pin,unb64(META.salt),META.iter);
    S=await unseal(key,BOX);KEY=key;migrate();
    if(META.fails){META.fails=0;await persist();}
    pin='';busy(false);enterApp();
  }catch(e){
    S=null;KEY=null;META.fails=(META.fails||0)+1;pin='';
    if(META.wipe&&META.fails>=META.wipe){await idb.del('vault');META=null;BOX=null;mode='setup1';busy(false);renderLock('Dane usunięte po zbyt wielu próbach');return;}
    await persist();busy(false);renderLock(`Błędny PIN (${META.fails}${META.wipe?' / '+META.wipe:''})`);
  }
}

function dayStart(ts){const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime();}

const isBig=s=>{const it=S.items.find(i=>i.id===s.itemId);return !!(it&&it.big);};
function weekStats(ws,now=Date.now()){
  const we=addDays(ws,7),inW=s=>s.start>=ws&&s.start<we;
  const P=S.sessions.filter(s=>s.cat==='P'),D=S.sessions.filter(s=>s.cat==='D'&&inW(s));
  let plugDays=0;for(let i=0;i<7;i++){const a=addDays(ws,i),b=addDays(ws,i+1);if(a>now)break;if(P.some(s=>!isBig(s)&&s.start<b&&(s.end||now)>=a))plugDays++;}

function dayData(ds,now){

function computeGame(now=Date.now()){

  let ao=0,big=0,dn=0,pH=0,r=0,targets=0;const nights=new Set();
  for(const s of S.sessions){const h=s.end?(s.end-s.start)/36e5:0;
    if(s.cat==='P'){if(isBig(s)){big++;add(s.start,XPV.Pbig+Math.min(20,Math.floor(h*2)*5),'P');}else add(s.start,XPV.P+Math.min(16,Math.floor(h)*2),'P');pH+=h;for(const n of nightsOf(s,now))nights.add(n);}

  let sw=0,ePlan=0;const E=[...S.events].sort((a,b)=>a.at-b.at);

  let prev=S.created,bestNoE=0;const gaps=[];for(const e of E){gaps.push([prev,e.at]);prev=e.at;}gaps.push([prev,now]);
  for(const [a,b] of gaps){const gp=(b-a)/864e5;bestNoE=Math.max(bestNoE,gp);for(const m of MILESTONES)if(gp>=m)add(a+m*864e5,m*5,'noe');}
  let pw=0;for(let w=weekStart(S.created);w<weekStart(now);w=addDays(w,7)){const [m,t]=goalsMet(w);if(t&&m===t){pw++;add(addDays(w,7)-1,XPV.week,'week');}}
  let chDone=0,todayCh=[];const all=[...S.sessions.map(x=>x.start),...S.events.map(x=>x.at)];
  for(let d=all.length?dayStart(Math.min(...all)):today;d<=today;d=addDays(d,1)){

    nights:nights.size,nightSet:nights,sw,ePlan,chDone,todayCh,targets,log};

  if(sn.level==null)sn.level=g.level;else if(g.level>sn.level){sn.level=g.level;const nm=levelName(g.level);q.push({conf:true,icon:levelMedal(g.level),big:'⬆️ '+g.level,num:true,sub:nm?esc(nm):'nowy poziom',text:msgOn?pick('level_up',{poziom:g.level,nazwa:nm||g.level}):''});}
  const un=BADGES.filter(b=>b[4](g)).map(b=>b[0]);
  if(!Array.isArray(sn.badges))sn.badges=un;else for(const id of un)if(!sn.badges.includes(id)){sn.badges.push(id);const b=BADGES.find(z=>z[0]===id);q.push({conf:true,icon:icon('b_'+b[0]),big:b[1],sub:'Nowa odznaka: <b>'+esc(badgeName(b))+'</b>',text:msgOn?pick('badge',{nazwa:badgeName(b)}):''});}
  sn.ch=Array.isArray(sn.ch)?sn.ch.filter(k=>k.startsWith(tk)):null;
  if(sn.ch==null)sn.ch=g.todayCh.filter(c=>c.done).map(c=>tk+':'+c.id);
  else for(const c of g.todayCh)if(c.done&&!sn.ch.includes(tk+':'+c.id)){sn.ch.push(tk+':'+c.id);q.push({conf:true,icon:icon('cel_ch'),big:'🎯',sub:`Wyzwanie zaliczone: <b>${esc(c.lab)}</b> · +${c.xp} XP`,text:msgOn?pick('challenge',{}):''});}
  if(sn.nights==null)sn.nights=g.nights;else if(g.nights>sn.nights){sn.nights=g.nights;q.push({conf:true,icon:icon('cel_night'),big:'🌙',sub:`Noc z ${alias('P')} · +${XPV.night} XP`,text:msgOn?pick('night',{n:g.nights}):''});}
  if(sn.xp!=null&&g.xp>sn.xp)toast(`+${g.xp-sn.xp} XP`);sn.xp=g.xp;
  save();
  const run=()=>{const t=q.shift();if(!t){if(then)then();else render();return;}if(t.conf)confetti();showCard(t,run);};run();
}

function renderStats(){
  const c=stat.cat,isS=c!=='E',now=Date.now();
  const all=(isS?S.sessions.filter(s=>s.cat===c&&s.end).map(s=>({t:s.start,d:s.end-s.start,r:s.rating,item:s.itemId,ao:s.ao||0})):S.events.map(e=>({t:e.at,r:e.rating,sw:!!e.sw,plan:e.plan}))).sort((a,b)=>a.t-b.t);
  const from=stat.range?now-stat.range*864e5:(all.length?all[0].t:now);
  const LL=all.filter(x=>x.t>=from),days=Math.max(1,(now-from)/864e5),n=LL.length;
  const rated=LL.filter(x=>x.r),avgR=rated.length?rated.reduce((s,x)=>s+x.r,0)/rated.length:null;
  const cur=all.length?now-all[all.length-1].t:null;
  let longest=0;for(let i=1;i<LL.length;i++)longest=Math.max(longest,L[i].t-L[i-1].t);if(cur!=null&&n)longest=Math.max(longest,cur);
  let h=`<div class="hdr"><b>Statystyki</b></div>`;
  h+=`<div class="seg">${CATS.map(x=>`<button class="${x===c?'on':''}" data-act="sc" data-v="${x}" style="color:${S.cats[x].color}">${alias(x)}</button>`).join('')}</div>`;
  h+=`<div class="seg">${[[30,'30 dni'],[90,'90 dni'],[365,'rok'],[0,'całość']].map(([v,l])=>`<button class="${stat.range===v?'on':''}" data-act="sr" data-v="${v}">${l}</button>`).join('')}</div>`;
  const K=(l,v)=>`<div class="kpi"><small>${l}</small><b class="num">${v}</b></div>`;
  h+='<div class="kpis">'+K('liczba',n)+K('na tydzień',fnum(n/(days/7)));
  if(isS){const ds=LL.map(x=>x.d).sort((a,b)=>a-b),tot=ds.reduce((s,x)=>s+x,0),med=ds.length?(ds.length%2?ds[(ds.length-1)/2]:(ds[ds.length/2-1]+ds[ds.length/2])/2):0;
    h+=K('łączny czas',n?dur(tot):'—')+K('mediana sesji',n?dur(med):'—')+K('najdłuższa sesja',n?dur(ds[ds.length-1]):'—')+K('średnio / tydzień',n?dur(tot/(days/7)):'—');}
  if(c==='D')h+=K(esc(L('ao_long')),LL.reduce((a,x)=>a+x.ao,0))+K('sesje z '+esc(L('ao')),LL.filter(x=>x.ao).length);
  if(c==='E')h+=K(esc(L('sw_long')),LL.filter(x=>x.sw).length)+K('w planie',LL.filter(x=>x.plan===true).length);
  h+=K('od ostatniego',cur!=null?dur(cur):'—')+K('najdłuższa przerwa',n?dur(longest):'—')+K('średnia ocena',avgR?fnum(avgR):'—')+'</div>';
  // heatmap: 17 tygodni, kolumny = tygodnie (pn–nd)
  const cnt={};for(const x of all){const k=dayKey(x.t);cnt[k]=(cnt[k]||0)+1;}
  const t0=new Date();t0.setHours(12,0,0,0);t0.setDate(t0.getDate()-(t0.getDay()+6)%7-16*7);
  const col=S.cats[c].color,todayK=dayKey(now);
  h+='<div class="sec">Ostatnie 17 tygodni</div><div class="heat">';
  for(let i=0;i<17*7;i++){const dt=new Date(t0);dt.setDate(t0.getDate()+i);const k=dayKey(dt.getTime()),v=cnt[k]||0;
    h+=k>todayK?'<i></i>':`<i style="background:${v?col:'#36363A'};opacity:${v?[0,.45,.75,1][Math.min(3,v)]:1}"></i>`;}
  h+='</div>';
  const dow=Array(7).fill(0),hr=Array(24).fill(0);for(const x of LL){const d=new Date(x.t);dow[(d.getDay()+6)%7]++;hr[d.getHours()]++;}
  const bars=(arr,labels)=>{const mx=Math.max(1,...arr);return `<div class="bars">${arr.map(v=>`<div style="height:${v/mx*100}%;background:${col}"></div>`).join('')}</div><div class="bl">${labels.map(l=>`<span>${l}</span>`).join('')}</div>`;};
  h+='<div class="sec">Dzień tygodnia</div>'+bars(dow,['pn','wt','śr','cz','pt','sb','nd']);
  h+='<div class="sec">Godzina rozpoczęcia</div>'+bars(hr,hr.map((_,i)=>i%6===0?i:''));
  if(isS){
    const g={};for(const x of LL){const k=x.item||'';(g[k]=g[k]||{n:0,t:0,r:[]}).n++;g[k].t+=x.d;if(x.r)g[k].r.push(x.r);}
    const rows=Object.entries(g).sort((a,b)=>b[1].n-a[1].n);
    if(rows.length){h+='<div class="sec">Przedmioty</div><div class="card"><table><tr><th>przedmiot</th><th class="r">×</th><th class="r">czas</th><th class="r">★</th></tr>';
      for(const [id,v] of rows)h+=`<tr><td>${esc(itemName(id)||'—')}</td><td class="r num">${v.n}</td><td class="r num">${dur(v.t)}</td><td class="r num">${v.r.length?fnum(v.r.reduce((a,b)=>a+b,0)/v.r.length):'—'}</td></tr>`;
      h+='</table></div>';}
  }
  $('#view').innerHTML=h;
}

      if(w.plan!=null)h+=`<span class="f">PLAN</span><div class="chips"><span class="chip ro">${w.plan?'✓ w planie':'poza planem'}</span></div>`;
      h+=`<span class="f">KONTEKST</span><input type="text" data-in="tag" list="tagl" maxlength="30" value="${esc(w.tag)}" placeholder="własny znacznik (opcjonalnie)"><datalist id="tagl">${tags.map(t=>`<option value="${esc(t)}">`).join('')}</datalist>`;
    }
    h+=`<span class="f">OCENA</span><div class="stars">${[1,2,3,4,5].map(n=>`<button class="${(w.rating||0)>=n?'on':''}" data-x="rate" data-v="${n}"></button>`).join('')}</div>`;
    h+=`<span class="f">NOTATKA</span><textarea data-in="note" rows="3" maxlength="2000" placeholder="Opcjonalnie…">${esc(w.note)}</textarea>`;
    h+=`<div class="err" id="err"></div><button class="save" data-x="save">Zapisz</button><div class="row2">${isNew?'<span></span>':`<button class="link danger" data-x="del">${delArm?'Na pewno usunąć?':'Usuń'}</button>`}<button class="link" data-x="close">${opt.finish?'Pomiń szczegóły':'Anuluj'}</button></div>`;
    return h;
  };
  openSheet(draw,(x,v,redraw)=>{
    if(x==='cat'){w.cat=v;w.itemId=null;redraw();}
    else if(x==='item'){w.itemId=w.itemId===v?null:v;redraw();}
    else if(x==='ao'){w.ao=+v;redraw();}
    else if(x==='sw'){w.sw=v==='1';redraw();}
    else if(x==='rate'){w.rating=w.rating===+v?null:+v;redraw();}
    else if(x==='sess'){w.sessionId=v||null;redraw();}
    else if(x==='addev'){S.events.push({id:uid(),at:w.end||Date.now(),rating:null,sessionId:w.id,tag:'',note:''});save();redraw();toast('Dodano zdarzenie');}
    else if(x==='close'){closeSheet();if(opt.finish&&k==='s')afterFinish(o);else if(opt.finish)celebrate();else render();}
    else if(x==='del'){
      if(!delArm){delArm=true;redraw();return;}
      const i=arr.findIndex(z=>z.id===w.id);if(i>=0)arr.splice(i,1);
      if(k==='s')S.events.forEach(e=>{if(e.sessionId===w.id)e.sessionId=null;});
      save();closeSheet();render();toast('Usunięto');
    }
    else if(x==='save'){
      const err=t=>{$('#err').textContent=t;};
      if(k==='s'){
        if(!w.start)return err('Podaj start');
        if(w.end&&w.end<w.start)return err('Koniec jest przed startem');
        if(!w.end&&S.sessions.some(s=>s.id!==w.id&&s.cat===w.cat&&!s.end))return err('Ta kategoria już trwa — podaj koniec');
      }else if(!w.at)return err('Podaj czas');
      if(k==='e'&&w.sessionId){const s=S.sessions.find(z=>z.id===w.sessionId);if(!s||s.start>w.at||(s.end&&s.end<w.at))w.sessionId=null;}
      if(isNew)arr.push(w);else Object.assign(o,w);
      save();closeSheet();if(opt.finish&&k==='s')afterFinish(o);else if(opt.finish)celebrate();else{render();toast('Zapisano');}
    }
  },ev=>{
    const n=ev.target.dataset.in;if(!n)return;
    if(n==='start'||n==='end'||n==='at'){w[n]=fromInput(ev.target.value);const dl=$('#durl');if(dl&&k==='s')dl.textContent=w.end&&w.start?dur(w.end-w.start):'trwa';}
    else w[n]=ev.target.value;
  });
}

$('#impf').addEventListener('change',async ev=>{
  const f=ev.target.files&&ev.target.files[0];if(!f||!S)return;
  let pack;try{pack=JSON.parse(await f.text());if(pack.f!=='dz1')throw 0;}catch(e){toast('To nie jest plik kopii');return;}
  pwSheet('Import kopii','Dane z kopii zastąpią obecne dane w aplikacji.',[['p','HASŁO KOPII']],async v=>{
    busy(true,'Odszyfrowywanie…');let data;
    try{data=await unseal(await derive(v.p||'',unb64(pack.salt),pack.iter),pack);}catch(e){busy(false);return 'Błędne hasło lub uszkodzony plik';}
    busy(false);
    if(!data||!Array.isArray(data.sessions))return 'Nieprawidłowa zawartość';
    const n=(data.sessions||[]).length+(data.events||[]).length;
    openSheet(()=>`<div class="grab"></div><h3>Zastąpić dane?</h3><p class="sub2">Obecnie: ${S.sessions.length+S.events.length} wpisów → z kopii: ${n} wpisów.</p><button class="save" data-x="ok">Zastąp</button><div class="row2"><span></span><button class="link" data-x="close">Anuluj</button></div>`,
    x=>{if(x==='close'){closeSheet();return;}S=data;migrate();save();closeSheet();tab='now';render();toast('Zaimportowano');});
  });
});

$('#impm').addEventListener('change',async ev=>{
  const f=ev.target.files&&ev.target.files[0];if(!f||!S)return;
  try{const pk=JSON.parse(await f.text());if(pk.f!=='dzmsg1'||!pk.pools||typeof pk.pools!=='object')throw 0;
    const pools={};let n=0;for(const [k,v] of Object.entries(pk.pools)){if(/^[a-z_0-9]{1,30}$/.test(k)&&Array.isArray(v)){pools[k]=v.filter(x=>typeof x==='string').map(x=>x.slice(0,500)).slice(0,200);n+=pools[k].length;}}
    const levels=Array.isArray(pk.levels)?pk.levels.filter(x=>typeof x==='string').map(x=>x.slice(0,40)).slice(0,100):undefined;
    const badges={};if(pk.badges&&typeof pk.badges==='object')for(const [k,v] of Object.entries(pk.badges))if(/^[a-z_0-9]{1,20}$/.test(k)&&typeof v==='string')badges[k]=v.slice(0,40);
    const icons={};let ni=0;if(pk.icons&&typeof pk.icons==='object')for(const [k,v] of Object.entries(pk.icons)){if(/^[a-z_0-9]{1,30}$/i.test(k)&&typeof v==='string'){const c=cleanSvg(v);if(c){icons[k]=c;ni++;}}}
    const labels={};if(pk.labels&&typeof pk.labels==='object')for(const [k,v] of Object.entries(pk.labels))if(/^[a-z_0-9]{1,20}$/.test(k)&&typeof v==='string')labels[k]=v.slice(0,40);
    S.msg={pools,levels,badges,icons:ni?icons:undefined,labels};headMsg.key='';await save();render();toast(`Wczytano ${n} tekstów. Usuń teraz plik z telefonu.`);
  }catch(e){toast('To nie jest pakiet komunikatów');}
});

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  if(!S&&!t.closest('#lock'))return;
  const fn=ACT[t.dataset.act];if(fn){e.preventDefault();fn(t.dataset,t);}
});
$('#view').addEventListener('change',ev=>{
  const el=ev.target,s=el.dataset.set;if(!s||!S)return;const c=el.dataset.cat;
  if(s==='alias')S.cats[c].alias=el.value.trim().slice(0,12)||c;
  else if(s==='color')S.cats[c].color=/^#[0-9a-f]{6}$/i.test(el.value)?el.value:DEF[c].color;
  else if(s==='limit'){const v=parseInt(el.value,10);S.cats[c].limit=v>0?v:null;}
  else if(s==='autolock')S.settings.autolock=+el.value;
  else if(s==='wipe')META.wipe=+el.value;
  else if(s==='g_plug')S.goals.plugDaily=el.value==='1';
  else if(s==='g_d'||s==='g_big'||s==='g_r'){const v=Math.max(0,Math.min(14,parseInt(el.value,10)||0));S.goals[{g_d:'dPerWeek',g_big:'bigPerWeek',g_r:'rPerWeek'}[s]]=v;}
  else if(s==='msgs')S.settings.msgs=el.value==='1';
  else if(s==='discreet')S.settings.discreet=el.value==='1';
  else if(s==='gfx')S.settings.gfx=el.value==='1';
  else if(s==='pl_mode')S.plan.mode=el.value;
  else if(s==='pl_n')S.plan.n=Math.max(1,Math.min(90,parseInt(el.value,10)||7));
  else if(s==='pl_p')S.plan.p=+el.value;
  headMsg.key='';
  save();render();
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){document.body.classList.add('veil');hiddenAt=Date.now();if(S&&S.settings.autolock===0)lock();}
  else{if(S&&Date.now()-hiddenAt>S.settings.autolock*1000)lock();document.body.classList.remove('veil');if(S)render();}
});

(async function init(){
  try{
    const v=await idb.get('vault');
    if(v&&v.ct){META={salt:v.salt,iter:v.iter,fails:v.fails||0,wipe:v.wipe==null?10:v.wipe};BOX={iv:v.iv,ct:v.ct};mode='unlock';}
    else mode='setup1';
  }catch(e){mode='setup1';}
  showLock();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
